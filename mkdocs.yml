site_name: PACKAGE
site_description: Single-molecule epigenomic analysis for long-read Fiber-seq data
repo_url: https://github.com/mc3365/PACKAGE
repo_name: mc3365/PACKAGE

theme:
  name: material
  features:
    - navigation.sections
    - navigation.expand
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      accent: indigo

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]

nav:
  - Home: index.md
  - Installation: installation.md
  - Tutorial: tutorial.md
  - Benchmark: benchmark.md
  - API Reference: api.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite

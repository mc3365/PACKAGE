site_name: MEI-Fiber
site_description: Multimodal Epigenetic Integration with Fiber-seq
repo_url: https://github.com/mc3365/MEI-Fiber
repo_name: mc3365/MEI-Fiber

theme:
  name: material
  features:
    - navigation.sections
    - navigation.expand
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      accent: indigo

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]

nav:
  - Home: index.md
  - Installation: installation.md
  - Tutorial: tutorial.md
  - Parameter Reference: parameters.md
  - Benchmark and Validation: benchmark.md
  - API Reference: api.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite

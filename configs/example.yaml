# Example PACKAGE configuration.
# Copy this to your own config and edit the paths.
#
# Run: PACKAGE build --config configs/example.yaml

output_dir: /vast/palmer/scratch/zsmith/mc3365/long_read/first_run/out/h5
output_file: fiber_database.h5

# Reference genome (used by the extract phase, not by build).
reference: /gpfs/gibbs/data/genomes/Mus_musculus/UCSC/mm10/Sequence/BWAIndex/genome.fa

# Per-sample input files. Each layer's path is explicit; only `nucleosomes` is
# required for build. Other layers (5mC, 5hmC, 6mA, msp) are optional and
# skipped if not listed.
#
# Note: 5mC and 5hmC come from the same modkit file (rows distinguished by
# `mod_code` column 'm' vs 'h'). Use the same path for both.
samples:
  - name: esc_2i_d0
    bam: /vast/palmer/scratch/zsmith/mc3365/long_read/first_run/out/esc_2i_d0.output.fiberseq.bam
    layers:
      nucleosomes: /vast/palmer/scratch/zsmith/mc3365/long_read/first_run/out/modification/d0_nuc_features.csv
      "5mC":       /vast/palmer/scratch/zsmith/mc3365/long_read/first_run/out/modification/esc_2i_d0_raw_mods.tsv.gz
      "5hmC":      /vast/palmer/scratch/zsmith/mc3365/long_read/first_run/out/modification/esc_2i_d0_raw_mods.tsv.gz
      "6mA":       /vast/palmer/scratch/zsmith/mc3365/long_read/first_run/out/modification/esc_2i_d0_6ma.bed
      msp:         /vast/palmer/scratch/zsmith/mc3365/long_read/first_run/out/modification/esc_2i_d0_msp.bed

  - name: esc_2i_d4
    bam: /vast/palmer/scratch/zsmith/mc3365/long_read/first_run/out/esc_2i_d4.output.fiberseq.bam
    layers:
      nucleosomes: /vast/palmer/scratch/zsmith/mc3365/long_read/first_run/out/modification/d4_nuc_features.csv
      "5mC":       /vast/palmer/scratch/zsmith/mc3365/long_read/first_run/out/modification/esc_2i_d4_raw_mods.tsv.gz
      "5hmC":      /vast/palmer/scratch/zsmith/mc3365/long_read/first_run/out/modification/esc_2i_d4_raw_mods.tsv.gz
      "6mA":       /vast/palmer/scratch/zsmith/mc3365/long_read/first_run/out/modification/esc_2i_d4_6ma.bed
      msp:         /vast/palmer/scratch/zsmith/mc3365/long_read/first_run/out/modification/esc_2i_d4_msp.bed

# User-curated master annotation BED4.
annotations:
  master: /vast/palmer/scratch/zsmith/mc3365/long_read/first_run/annotations/master_annotations_v3.uniqueID.bed

parameters:
  methylation_threshold: 0.5
  min_msp_size: 10

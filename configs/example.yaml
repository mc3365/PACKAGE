    input_dir: /vast/palmer/scratch/zsmith/mc3365/long_read/first_run/out/d0
    ft_extract: d0_fibers.bed.gz
    modkit_extract: d0_raw_mods.tsv.gz

  - name: d4
    input_dir: /vast/palmer/scratch/zsmith/mc3365/long_read/first_run/out/d4
    ft_extract: d4_fibers.bed.gz
    modkit_extract: d4_raw_mods.tsv.gz

annotations:

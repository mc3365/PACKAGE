# Example PACKAGE configuration.
# Copy this to your own config and edit the paths.
#
# Run: PACKAGE build --config configs/example.yaml

output_dir: /nfs/roberts/scratch/pi_zs296/mc3365/long_read/first_run/out/h5
output_file: fiber_database_PACKAGE.h5

# Reference genome (used by the extract phase, not by build).
reference: /nfs/roberts/project/pi_zs296/mc3365/database/genome/genome.fa

# Per-sample input files. Each layer's path is explicit; only `nucleosomes` is
# required for build. Other layers (5mC, 5hmC, 6mA, msp) are optional and
# skipped if not listed.
#
# Note: 5mC and 5hmC come from the same modkit file (rows distinguished by
# `mod_code` column 'm' vs 'h'). Use the same path for both.
samples:
  - name: d0
    bam: /nfs/roberts/scratch/pi_zs296/mc3365/long_read/first_run/out/esc_2i_d0.output.fiberseq.bam
    layers:
      nucleosomes: /nfs/roberts/scratch/pi_zs296/mc3365/long_read/first_run/out/modification/d0_nuc_features.csv
      "5mC":       /nfs/roberts/scratch/pi_zs296/mc3365/long_read/first_run/out/modification/esc_2i_d0_raw_mods.tsv.gz
      "5hmC":      /nfs/roberts/scratch/pi_zs296/mc3365/long_read/first_run/out/modification/esc_2i_d0_raw_mods.tsv.gz
      "6mA":       /nfs/roberts/scratch/pi_zs296/mc3365/long_read/first_run/out/esc_2i_d0_6ma.bed
      msp:         /nfs/roberts/scratch/pi_zs296/mc3365/long_read/first_run/out/esc_2i_d0_msp.bed

  - name: d4
    bam: /nfs/roberts/scratch/pi_zs296/mc3365/long_read/first_run/out/esc_2i_d4.output.fiberseq.bam
    layers:
      nucleosomes: /nfs/roberts/scratch/pi_zs296/mc3365/long_read/first_run/out/modification/d4_nuc_features.csv
      "5mC":       /nfs/roberts/scratch/pi_zs296/mc3365/long_read/first_run/out/modification/esc_2i_d4_raw_mods.tsv.gz
      "5hmC":      /nfs/roberts/scratch/pi_zs296/mc3365/long_read/first_run/out/modification/esc_2i_d4_raw_mods.tsv.gz
      "6mA":       /nfs/roberts/scratch/pi_zs296/mc3365/long_read/first_run/out/esc_2i_d4_6ma.bed
      msp:         /nfs/roberts/scratch/pi_zs296/mc3365/long_read/first_run/out/esc_2i_d4_msp.bed

# User-curated master annotation BED4.
annotations:
  master: /nfs/roberts/scratch/pi_zs296/mc3365/long_read/first_run/feature_annotation/master_annotations_v3.uniqueID.bed

parameters:
  methylation_threshold: 0.5
  min_msp_size: 10

extraction:
  threads: 16
  overwrite: false
  keep_nucleosome_bed: true
  validate_bam: true
  write_manifest: true
  modkit_executable: /nfs/roberts/pi/pi_zs296/mc3365/env/ont_env/bin/modkit
  ft_executable: /nfs/roberts/pi/pi_zs296/mc3365/env/ont_env/bin/ft
  samtools_executable: /nfs/roberts/pi/pi_zs296/mc3365/env/ont_env/bin/samtools

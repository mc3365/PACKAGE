# Portable PacBio template. Replace every /path/to value before running.
#
# PacBio currently supports:
#   nucleosomes, 5mC, 6mA, MSP, and optional FIRE accessibility calls
#
# The extractor normalizes fibertools outputs before HDF5 build:
#   - ft extract --all -> modkit-like 5mC TSV
#   - ft extract --m6a -> normalized BED12 6mA
#   - ft extract --msp -> normalized BED12 MSP
#   - ft extract --nuc -> flattened nucleosome CSV
#   - ft fire --extract -> FIRE/accessibility BED for co-accessibility
#
# PacBio 5hmC is not currently built. The fire_accessibility layer is distinct
# from the raw 0-255 fire list in ft extract --all.
# FIRE modeling itself is upstream of PACKAGE. To generate fire_accessibility
# during PACKAGE extract, samples[].bam must be a FIRE-annotated *.fire.bam.
# For exact legacy co-accessibility reproduction, point fire_accessibility to
# the original acc.model.results.sort.bed used by that analysis.
output_dir: /path/to/output
output_file: pacbio_fiber_database.h5
reference: /path/to/reference/genome.fa

samples:
  - name: pacbio_sample1
    bam: /path/to/pacbio_sample1.fire.bam
    layers:
      nucleosomes: /path/to/output/pacbio_sample1_nuc_features.csv
      "5mC": /path/to/output/pacbio_sample1_5mc_for_PACKAGE.tsv.gz
      "6mA": /path/to/output/pacbio_sample1_6ma_for_PACKAGE.bed
      msp: /path/to/output/pacbio_sample1_msp_for_PACKAGE.bed
      fire_accessibility: /path/to/output/pacbio_sample1_acc.model.results.bed

# Optional. Add the same master annotation BED used for ONT if you want
# query_annotation_fast() and centered annotation plots.
annotations:
  master: /path/to/master_annotations_basic.uniqueID.bed

parameters:
  methylation_threshold: 0.5
  min_msp_size: 10

build:
  build_spatial_index: true

extraction:
  threads: 16
  overwrite: false
  keep_nucleosome_bed: true
  validate_bam: true
  write_manifest: true
  ft_executable: ft
  samtools_executable: samtools
